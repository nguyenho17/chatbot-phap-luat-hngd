<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Khôi phục tài khoản - Galaxy AI Law</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        .forgot-page { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .forgot-box { 
            width: 450px; padding: 40px; border-radius: 20px; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); 
            backdrop-filter: blur(15px); box-shadow: 0 0 40px rgba(0,0,0,0.6);
        }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .forgot-box h2 { 
            text-align: center; margin-bottom: 20px; 
            background: linear-gradient(to right, #00d2ff, #92fe9d); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        .user-card {
            background: rgba(255,255,255,0.1); padding: 20px; border-radius: 15px;
            text-align: center; margin-bottom: 20px; border: 1px dashed #00d2ff;
        }
        .user-card img { width: 70px; height: 70px; border-radius: 50%; margin-bottom: 10px; border: 2px solid #00d2ff; }
        .login-input { 
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2);
            color: white; outline: none; text-align: center; font-size: 1rem;
        }
        .btn-action {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            color: white; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-action:hover { opacity: 0.9; transform: scale(1.02); }
        .msg { text-align: center; margin-top: 15px; font-size: 0.85rem; min-height: 20px; }
    </style>
</head>
<body>

<div class="forgot-page">
    <div class="forgot-box">
        
        <div id="step1" class="step active">
            <h2>Tìm tài khoản</h2>
            <p style="color: #ccc; text-align: center; margin-bottom: 20px;">Nhập email để tìm kiếm trong hệ thống.</p>
            <input type="email" id="emailInput" class="login-input" placeholder="Ví dụ: nguyenvan@gmail.com">
            <button class="btn-action" onclick="findAccount()">Tìm kiếm</button>
        </div>

        <div id="step2" class="step">
            <h2>Đây có phải bạn?</h2>
            <div class="user-card">
                <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar">
                <div id="foundName" style="font-weight: bold; font-size: 1.1rem; color: #00d2ff;"></div>
                <div id="foundEmail" style="font-size: 0.9rem; color: #aaa;"></div>
            </div>
            <button class="btn-action" onclick="sendOTP()">Đúng là tôi, gửi mã OTP</button>
            <p onclick="goStep(1)" style="text-align: center; cursor: pointer; color: #ff6b6b; margin-top: 10px; font-size: 0.8rem;">Không phải tôi?</p>
        </div>

        <div id="step3" class="step">
            <h2>Xác thực OTP</h2>
            <p style="color: #ccc; text-align: center; margin-bottom: 20px;">Mã xác thực đã được gửi đến Email của bạn.</p>
            <input type="text" id="otpInput" class="login-input" placeholder="Nhập 6 chữ số" maxlength="6">
            <button class="btn-action" onclick="verifyOTP()">Tiếp tục</button>
        </div>

        <div id="step4" class="step">
            <h2>Mật khẩu mới</h2>
            <input type="password" id="newPass" class="login-input" placeholder="Mật khẩu mới">
            <input type="password" id="confirmPass" class="login-input" placeholder="Xác nhận mật khẩu mới">
            <button class="btn-action" onclick="updatePassword()">Hoàn tất</button>
        </div>

        <p id="globalMsg" class="msg"></p>
        <div style="text-align: center; margin-top: 15px;">
            <a href="login.html" style="color: #92fe9d; text-decoration: none; font-size: 0.8rem;"><i class="fas fa-arrow-left"></i> Quay lại Đăng nhập</a>
        </div>
    </div>
</div>

<script>
    let tempEmail = "";

    function goStep(n) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById('step' + n).classList.add('active');
        document.getElementById('globalMsg').innerText = "";
    }

    async function findAccount() {
        const email = document.getElementById('emailInput').value;
        if(!email) return showMsg("Vui lòng nhập email!", "#ff6b6b");

        try {
            const res = await fetch("http://127.0.0.1:8000/auth/find-account", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ email })
            });
            const data = await res.json();
            if(res.ok) {
                tempEmail = email;
                document.getElementById('foundName').innerText = data.name;
                document.getElementById('foundEmail').innerText = data.email;
                goStep(2);
            } else {
                showMsg(data.detail, "#ff6b6b");
            }
        } catch (e) { showMsg("Lỗi kết nối server!", "#ff6b6b"); }
    }

    async function sendOTP() {
        showMsg("Đang gửi mã...", "#00d2ff");
        try {
            const res = await fetch("http://127.0.0.1:8000/auth/send-otp", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ email: tempEmail })
            });
            if(res.ok) {
                goStep(3);
                showMsg("Đã gửi OTP!", "#92fe9d");
            }
        } catch (e) { showMsg("Không gửi được mã!", "#ff6b6b"); }
    }

    async function verifyOTP() {
        const otp = document.getElementById('otpInput').value;
        if(otp.length < 6) return showMsg("Mã OTP gồm 6 số!", "#ff6b6b");
        
        // Giả sử API check OTP trả về OK
        goStep(4);
    }

    async function updatePassword() {
        const p1 = document.getElementById('newPass').value;
        const p2 = document.getElementById('confirmPass').value;
        if(p1 !== p2) return showMsg("Mật khẩu không khớp!", "#ff6b6b");

        try {
            const res = await fetch("http://127.0.0.1:8000/auth/reset-password", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({ email: tempEmail, new_password: p1, otp: document.getElementById('otpInput').value })
            });
            if(res.ok) {
                showMsg("Đổi mật khẩu thành công!", "#92fe9d");
                setTimeout(() => window.location.href = "login.html", 2000);
            }
        } catch (e) { showMsg("Lỗi cập nhật!", "#ff6b6b"); }
    }

    function showMsg(txt, color) {
        const m = document.getElementById('globalMsg');
        m.innerText = txt;
        m.style.color = color;
    }
</script>
</body>
</html>
