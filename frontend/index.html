<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galaxy AI Law – Tư vấn pháp luật</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <h2><i class="fas fa-atom"></i> Chatbot - Tư vấn luật pháp</h2>
            <button id="newChat">
                <i class="fas fa-plus-circle"></i> Chat mới
            </button>
            <div class="history-header" onclick="toggleHistory()">
                <span>Các đoạn chat của bạn</span>
                <i id="historyArrow" class="fas fa-chevron-right"></i>
            </div>
            <div class="history" id="history"></div>
        </aside>

        <main class="chat-area">
            <header class="header">
                <div><i class="fas fa-stars"></i> Trợ lý AI Pháp luật</div>
                <div id="authContainer" class="user-menu-container">
                <button id="userMenuBtn" class="login-btn">
                    <i class="fas fa-user-circle"></i>
                    <span id="headerUserName">Thành viên</span>
                    <i class="fas fa-chevron-downArrow fa-xs" style="margin-left:5px;"></i>
                </button>

                <div id="userDropdown" class="user-dropdown-menu">
                    <div class="dropdown-item" onclick="openProfileModal()">
                        <i class="fas fa-id-card"></i> Hồ sơ cá nhân
                    </div>
                    <div class="dropdown-divider"></div>
                    <div class="dropdown-item logout-item" onclick="handleLogout()">
                        <i class="fas fa-sign-out-alt"></i> Thoát
                    </div>
                </div>
            </div>

            <div id="profileModal" class="modal profile-modal">
                <div class="modal-content">
                    <span class="close-modal" onclick="closeProfileModal()">&times;</span>
                    <h3><i class="fas fa-user-vcard"></i> Hồ sơ của bạn</h3>
                    <div class="profile-details">
                        <div class="profile-info-group">
                            <label>Tên hiển thị:</label>
                            <p id="profileDisplayName"></p>
                        </div>
                        <div class="profile-info-group">
                            <label>Tên đăng nhập:</label>
                            <p id="profileUsername"></p>
                        </div>
                        <div class="profile-info-group">
                            <label>Tài khoản Gmail:</label>
                            <p id="profileEmail"></p>
                        </div>
                    </div>
                </div>
            </div>
            </header>

            <div id="guestWarning" class="guest-warning" style="display: none;">
                <i class="fas fa-exclamation-circle"></i> 
                Bạn đang sử dụng chế độ khách. <a href="login.html">Đăng nhập</a> để lưu lại lịch sử trò chuyện.
            </div>

            <div class="messages" id="messages">
                <div class="message bot">
                    <i class="fas fa-magic"></i> Sẵn sàng hỗ trợ pháp luật. Mời bạn đặt câu hỏi.
                </div>
            </div>

            <div class="input-section">
                <div class="input-container">
                    <textarea id="question" rows="1" placeholder="Khám phá kiến thức luật pháp..."></textarea>
                    <button id="send"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
