<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đặt lại mật khẩu - Galaxy AI Law</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <style>
        .reset-page { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .reset-box { 
            width: 420px; padding: 40px; border-radius: 20px; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); 
            backdrop-filter: blur(15px); box-shadow: 0 0 40px rgba(0,0,0,0.6); 
        }
        .reset-box h2 { 
            text-align: center; margin-bottom: 25px; 
            background: linear-gradient(to right, #00d2ff, #92fe9d); 
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
        }
        .login-input { 
            width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2); background: rgba(0,0,0,0.2);
            color: white; outline: none;
        }
        .btn-reset {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            color: white; font-weight: bold; cursor: pointer; transition: 0.3s;
        }
        .btn-reset:hover { opacity: 0.9; transform: translateY(-2px); }
    </style>
</head>
<body>
<div class="reset-page">
    <div class="reset-box">
        <h2><i class="fas fa-key"></i> Đặt mật khẩu mới</h2>
        <p style="text-align: center; color: #ccc; margin-bottom: 20px; font-size: 0.9rem;">
            Vui lòng nhập mật khẩu mới cho tài khoản của bạn.
        </p>

        <input type="password" id="newPassword" class="login-input" placeholder="Mật khẩu mới">
        <input type="password" id="confirmPassword" class="login-input" placeholder="Xác nhận mật khẩu">
        
        <button class="btn-reset" onclick="handleReset()">Cập nhật mật khẩu</button>
        
        <p id="message" style="margin-top: 15px; text-align: center; font-size: 0.9rem;"></p>
    </div>
</div>

<script>
async function handleReset() {
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;
    const msgElement = document.getElementById("message");

    // 1. Lấy token từ URL (ví dụ: ?token=abc123xyz)
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
        msgElement.style.color = "#ff6b6b";
        msgElement.innerText = "Lỗi: Link không hợp lệ hoặc thiếu mã xác thực!";
        return;
    }

    if (!newPassword || newPassword.length < 6) {
        msgElement.style.color = "#ff6b6b";
        msgElement.innerText = "Mật khẩu phải từ 6 ký tự trở lên!";
        return;
    }

    if (newPassword !== confirmPassword) {
        msgElement.style.color = "#ff6b6b";
        msgElement.innerText = "Mật khẩu xác nhận không khớp!";
        return;
    }

    try {
        // Gọi API Backend mà bạn sẽ viết trong auth_api.py
        const res = await fetch("http://127.0.0.1:8000/auth/reset-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token: token, new_password: newPassword })
        });

        const data = await res.json();

        if (res.ok) {
            msgElement.style.color = "#92fe9d";
            msgElement.innerText = "Thành công! Đang chuyển hướng về trang đăng nhập...";
            setTimeout(() => { window.location = "login.html"; }, 3000);
        } else {
            msgElement.style.color = "#ff6b6b";
            msgElement.innerText = data.detail || "Có lỗi xảy ra, vui lòng thử lại.";
        }
    } catch (err) {
        msgElement.style.color = "#ff6b6b";
        msgElement.innerText = "Không thể kết nối tới máy chủ!";
    }
}
</script>
</body>
</html>
